apiVersion: batch/v1
kind: Job
metadata:
  name: manual-job
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: batch-worker
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: batch
      tolerations:
        - key: workload
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: worker
          image: ${IMAGE}
          env:
            - name: RUN_MODE
              value: compute
            - name: TASK_ID
              value: manual-001
            - name: PROCESS_SECONDS
              value: "30"
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi

