apiVersion: batch/v1
kind: Job
metadata:
  name: indexed-job
  namespace: ${NAMESPACE}
spec:
  completions: 12
  parallelism: 4
  completionMode: Indexed
  backoffLimitPerIndex: 2
  maxFailedIndexes: 2
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: batch-worker
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: batch
      tolerations:
        - key: workload
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: worker
          image: ${IMAGE}
          env:
            - name: RUN_MODE
              value: compute
            - name: PROCESS_SECONDS
              value: "45"
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi

